; ============================================================================
;  platformio.ini -- ALTERNATIVER Build der IVCU-Firmware (ungetestet!)
;  ---------------------------------------------------------------------------
;  Primaerwege:  python build.py   ODER   make
;  PlatformIO baut ohne Framework (bare-metal, eigene Vektortabelle):
;    pio run
;    pio run -t upload   (ST-Link; upload_protocol ggf. anpassen)
;
;  Board "genericSTM32F103RC" passt auf die GD32F303-Klasse (F1-artige
;  Peripherie); Schreibzugriffe laufen ueber openocd/stlink.
;  Bei Problemen lieber build.py verwenden und mit OpenOCD flashen.
; ============================================================================

[env:ivcu_fw]
platform = ststm32
board = genericSTM32F103RC
; kein framework -> PlatformIO kompiliert nur unsere Quelldateien
build_flags =
    -Iinclude
    -mcpu=cortex-m3
    -mthumb
    -Wall
    -Wextra
board_build.ldscript = ld/ivcu_full.ld
upload_protocol = stlink
