; ============================================================================
;  can_sniffer_esp32 -- passiver CAN-Sniffer fuer den Teverun-BMS-Bus
;  PlatformIO / Arduino-ESP32
; ============================================================================
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
    -DCAN_BITRATE=500000
; Bitrate bei Bedarf auf 250000 oder 1000000 aendern (Teverun-BMS: unbekannt!)
